<div class="form-container">
  <h2>Nova tarefa</h2>
  
  <div class="action-row">
    
    <div class="input-wrapper">
     <input
        #taskInput
        id="taskInput"
        type="text"
        class="ds-input"
        [class.error]="hasError"
        (input)="clearError()"
        (keyup.enter)="submitTask(taskInput)" 
        [disabled]="(loading$ | async) ?? false"
        placeholder="Ex: Estudar arquitetura de micro-frontends..."
      />
      
      <svg *ngIf="hasError" class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" clip-rule="evenodd" />
      </svg>
    </div>
    
    <app-button 
      [loading]="(loading$ | async) ?? false"
      (btnClick)="submitTask(taskInput)">
      
      <svg *ngIf="!(loading$ | async)" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>

      {{ (loading$ | async) ? 'Adicionando' : 'Adicionar' }}
    </app-button>

  </div>
  
  <span class="support-text" role="alert" [class.error]="hasError">
    {{ hasError ? errorMessage : 'A tarefa deve ter no mínimo 20 letras (sem números).' }}
  </span>
  
</div>
